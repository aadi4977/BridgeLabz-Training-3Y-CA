<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 3 - Responsive Image Showcase</title>
  <style>
    /* Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f1f4f8;
      color: #2c3e50;
      padding: 35px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header h1 {
      font-size: 26px;
      color: #1e272e;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      color: #747d8c;
    }

    /* Grid layout displaying 6 cards (3 columns on desktop) */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      max-width: 980px;
      margin: 0 auto 40px auto;
    }

    /* Individual figure card */
    .showcase-item {
      background-color: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.3s ease;
    }

    .showcase-item:hover {
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
    }

    /* Container wrapping image and dark overlay */
    .img-container {
      position: relative;
      overflow: hidden;
      height: 180px;
      background-color: #2c3e50;
    }

    /* The image itself */
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /* Smooth zoom transition */
      transition: transform 0.35s ease;
    }

    /* Dark semi-transparent overlay using ::after */
    .img-container::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    /* Hover effect: Scale up by 1.1 and darken with overlay */
    .showcase-item:hover .img-container img {
      transform: scale(1.1);
    }

    .showcase-item:hover .img-container::after {
      opacity: 1;
    }

    /* Caption styling below each image */
    figcaption {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    figcaption h2 {
      font-size: 16px;
      color: #2c3e50;
    }

    figcaption p {
      font-size: 13px;
      color: #7f8c8d;
      line-height: 1.4;
    }

    /* =======================================================
       RESPONSIVE BREAKPOINT: Stack in one column below 700px
       ======================================================= */
    @media (max-width: 700px) {
      .image-grid {
        grid-template-columns: 1fr;
      }
    }

    footer {
      text-align: center;
      font-size: 13px;
      color: #888888;
    }
  </style>
</head>
<body>

  <header>
    <h1>Responsive Image Showcase</h1>
    <p>Hover over cards to see <code>transform: scale(1.1)</code> and dark overlay transitions</p>
  </header>

  <main>
    <section class="image-grid">

      <!-- Item 1 -->
      <figure class="showcase-item">
        <div class="img-container">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='260' viewBox='0 0 400 260'><rect width='100%25' height='100%25' fill='%233498db'/><circle cx='200' cy='110' r='50' fill='%23f1c40f'/><path d='M0,260 L120,160 L240,260 Z' fill='%232980b9'/><path d='M160,260 L280,140 L400,260 Z' fill='%231f618d'/></svg>" alt="Mountain Sunrise">
        </div>
        <figcaption>
          <h2>Mountain Sunrise</h2>
          <p>High altitude peaks bathed in early golden morning light.</p>
        </figcaption>
      </figure>

      <!-- Item 2 -->
      <figure class="showcase-item">

          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='260' viewBox='0 0 400 260'><rect width='100%25' height='100%25' fill='%231abc9c'/><circle cx='320' cy='60' r='35' fill='%23ffffff' opacity='0.8'/><path d='M0,180 Q100,140 200,180 T400,180 L400,260 L0,260 Z' fill='%2316a085'/></svg>" alt="Coastal Breeze">
        </div>
        <figcaption>
          <h2>Coastal Breeze</h2>
          <p>Calm ocean shoreline on a clear and sunny summer afternoon.</p>
        </figcaption>
      </figure>

      <!-- Item 3 -->

      <!-- Item 4 -->
      <figure class="showcase-item">
        <div class="img-container">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='260' viewBox='0 0 400 260'><rect width='100%25' height='100%25' fill='%23e67e22'/><circle cx='200' cy='200' r='120' fill='%23d35400'/><rect x='0' y='210' width='400' height='50' fill='%23ba4a00'/></svg>" alt="Desert Dunes">
        </div>
        <figcaption>
          <h2>Desert Dunes</h2>

        </figcaption>
      </figure>

      <!-- Item 5 -->
      <figure class="showcase-item">
        <div class="img-container">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='260' viewBox='0 0 400 260'><rect width='100%25' height='100%25' fill='%2327ae60'/><rect x='60' y='120' width='50' height='140' fill='%232ecc71'/><rect x='160' y='90' width='60' height='170' fill='%23229954'/><rect x='280' y='110' width='55' height='150' fill='%231e8449'/></svg>" alt="Pine Forest">

          <h2>Pine Forest</h2>

      </figure>

      <!-- Item 6 -->
      <figure class="showcase-item">
        <div class="img-container">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='260' viewBox='0 0 400 260'><rect width='100%25' height='100%25' fill='%238e44ad'/><circle cx='200' cy='130' r='60' fill='%239b59b6'/><path d='M0,220 Q200,160 400,220 L400,260 L0,260 Z' fill='%236c3483'/></svg>" alt="Violet Twilight">
        </div>
        <figcaption>
          <h2>Violet Twilight</h2>
          <p>Atmospheric evening horizon with dramatic purple glow.</p>
        </figcaption>
      </figure>

    </section>
  </main>

  <footer>
    <p>CSS Assignment 8 &bull; Lecture 19-21 &bull; Question 3</p>
  </footer>

</body>
</html>
