<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q5 - Pricing Section (Flexbox)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="pricing">
    <div class="plan">
      <h2>Basic</h2>
      <p class="cost">$9<span>/mo</span></p>
      <ul>
        <li>1 Project</li>
        <li>5GB Storage</li>
        <li>Email Support</li>
      </ul>
    </div>

    <div class="plan featured">
      <h2>Pro</h2>
      <p class="cost">$19<span>/mo</span></p>
      <ul>
        <li>10 Projects</li>
        <li>50GB Storage</li>
        <li>Priority Support</li>
      </ul>
    </div>

    <div class="plan">
      <h2>Enterprise</h2>
      <p class="cost">$39<span>/mo</span></p>
      <ul>
        <li>Unlimited Projects</li>
        <li>500GB Storage</li>
        <li>24/7 Support</li>
      </ul>
    </div>
  </section>
</body>
</html>
