<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q10 - Combined Flexbox and Grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">MySite</div>
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">Blog</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="layout">
    <article class="article">
      <h1 class="fade-title">Welcome to My Blog</h1>
      <p>This layout combines Flexbox for the header and article boxes,
         with CSS Grid structuring the overall two-column page.</p>

      <div class="info-boxes">
        <div class="info-box">Fast</div>
        <div class="info-box">Responsive</div>
        <div class="info-box">Modern</div>
      </div>
    </article>

    <aside class="sidebar">
      <h2>Sidebar</h2>
      <p>Recent posts, categories, and links go here.</p>
    </aside>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 MySite. All rights reserved.</p>
  </footer>
</body>
</html>
