<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q8 - Photo Gallery (Grid)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Photo Gallery</h1>
  <div class="gallery">
    <figure>
      <img src="https://picsum.photos/id/10/400/300" alt="Forest">
      <figcaption>Forest Trail</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/20/400/300" alt="Laptop">
      <figcaption>Workspace</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/30/400/300" alt="Nature">
      <figcaption>Wilderness</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/40/400/300" alt="Bike">
      <figcaption>Adventure</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/50/400/300" alt="Landscape">
      <figcaption>Open Fields</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/60/400/300" alt="Mountains">
      <figcaption>Mountain View</figcaption>
    </figure>
  </div>
</body>
</html>
