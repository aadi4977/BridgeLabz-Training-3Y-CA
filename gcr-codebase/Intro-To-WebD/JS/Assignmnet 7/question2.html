<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q2: Live Character Counter with Warning Behavior</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 22px;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    p.desc {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      height: 130px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      padding: 12px;
      font-size: 15px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    textarea:focus {
      border-color: #38bdf8;
    }
    .counter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    #char-counter {
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }
    #warning-badge {
      display: none;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.15);
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    button.btn-reset {
      background: #475569;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button.btn-reset:hover { background: #64748b; }
    .back-link {
      margin-top: 20px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Question 2: Live Character Counter</h1>
    <p class="desc">
      Tracks remaining characters (max 100). Turns <strong>yellow</strong> at 20 characters left, turns <strong>red</strong> at 0 and blocks further typing via <code>preventDefault()</code>. Reset clears everything.
    </p>

    <textarea id="char-textarea" placeholder="Start typing your message (limit 100 characters)..."></textarea>

    <div class="counter-bar">
      <div id="char-counter">100 characters remaining (Max: 100)</div>
      <div id="warning-badge"></div>
    </div>

    <div class="actions">
      <button class="btn-reset" id="reset-btn">Reset</button>
    </div>
  </div>

  <a href="index.html" class="back-link">← Back to Assignment 7 Dashboard</a>

  <script src="question2.js"></script>
</body>
</html>
