<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q9: Form Submit Blocker with preventDefault() & Live Errors</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 580px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 26px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 22px;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    p.desc {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }
    input:focus {
      border-color: #38bdf8;
    }
    .error-msg {
      color: #ef4444;
      font-size: 12px;
      margin-top: 4px;
      display: none;
      font-weight: 500;
    }
    button.btn-submit {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
      margin-top: 10px;
    }
    button.btn-submit:hover { background: #0369a1; }

    #form-success-banner {
      display: none;
    }

    .back-link {
      margin-top: 24px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Question 9: Form Submit Blocker & Live Errors</h1>
    <p class="desc">
      Demonstrates preventing default form submission via <code>preventDefault()</code>.
      If invalid, displays inline error messages. When user types to correct input, errors disappear <strong>automatically</strong> in real time.
    </p>

    <form id="reg-form" novalidate>
      <div class="form-group">
        <label for="reg-name">Full Name (Required):</label>
        <input type="text" id="reg-name" placeholder="e.g. Alex Morgan" />
        <div class="error-msg" id="error-name"></div>
      </div>

      <div class="form-group">
        <label for="reg-email">Email Address (Must contain @):</label>
        <input type="email" id="reg-email" placeholder="e.g. alex@example.com" />
        <div class="error-msg" id="error-email"></div>
      </div>

      <div class="form-group">
        <label for="reg-password">Password (Minimum 6 characters):</label>
        <input type="password" id="reg-password" placeholder="At least 6 characters" />
        <div class="error-msg" id="error-password"></div>
      </div>

      <button type="submit" class="btn-submit">Submit Form</button>
    </form>

    <div id="form-success-banner"></div>
  </div>

  <a href="index.html" class="back-link">← Back to Assignment 7 Dashboard</a>

  <script src="question9.js"></script>
</body>
</html>
